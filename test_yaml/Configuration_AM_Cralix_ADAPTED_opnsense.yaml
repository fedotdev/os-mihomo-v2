# Рабочая мобильная база + AM Cralix. Поиск процессов отключён.
# Bootstrap: прямой DoH по IP. DNS сайтов, включая DIRECT: DoH через VPN.
# Не блокирует самостоятельно обход DNS через роутер на уровне ОС.
# OPNsense-адаптация: stack gvisor (mixed не создаёт tun на FreeBSD),
# tun.device tun_mihomo (правила фаервола), dns.listen 1053 (Unbound forward).
mixed-port: 7890
allow-lan: false
tcp-concurrent: true
find-process-mode: 'off'
mode: rule
log-level: info
ipv6: false
keep-alive-interval: 30
unified-delay: true
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
tun:
  enable: true
  stack: gvisor
  device: tun_mihomo
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
  - any:53
  - tcp://any:53
  strict-route: true
  mtu: 1400
dns:
  enable: true
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: redir-host
  default-nameserver:
  - https://1.1.1.1/dns-query
  - https://9.9.9.9/dns-query
  proxy-server-nameserver:
  - https://1.1.1.1/dns-query
  - https://9.9.9.9/dns-query
  direct-nameserver:
  - https://dns.quad9.net/dns-query#🌍 VPN
  - https://cloudflare-dns.com/dns-query#🌍 VPN
  direct-nameserver-follow-policy: true
  nameserver:
  - https://dns.quad9.net/dns-query#🌍 VPN
  - https://cloudflare-dns.com/dns-query#🌍 VPN
  nameserver-policy:
    rule-set:ru-inline-banned:
    - https://dns.quad9.net/dns-query#🌍 VPN
    - https://cloudflare-dns.com/dns-query#🌍 VPN
    rule-set:geosite-ru:
    - https://dns.quad9.net/dns-query#🌍 VPN
    - https://cloudflare-dns.com/dns-query#🌍 VPN
    +.ru:
    - https://dns.quad9.net/dns-query#🌍 VPN
    - https://cloudflare-dns.com/dns-query#🌍 VPN
    +.su:
    - https://dns.quad9.net/dns-query#🌍 VPN
    - https://cloudflare-dns.com/dns-query#🌍 VPN
    +.xn--p1ai:
    - https://dns.quad9.net/dns-query#🌍 VPN
    - https://cloudflare-dns.com/dns-query#🌍 VPN
